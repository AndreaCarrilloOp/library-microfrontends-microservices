<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Library Catalog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="home-page">
    <header class="home-heading">
      <p class="section-label">Library collection</p>
      <h1>Books, authors, publishers and reviews.</h1>
      <p>Browse the catalog through four independent mini-sites connected by the application shell.</p>
    </header>

    <nav class="home-links" aria-label="Catalog sections">
      <a class="home-link" href="https://book-microfrontend.netlify.app">
        <strong>Books</strong>
        <span>Titles and publication details</span>
      </a>
      <a class="home-link" href="https://AndreaCarrilloOp.github.io/library-microfrontends-microservices/microfrontends/authors">
        <strong>Authors</strong>
        <span>Writers and related books</span>
      </a>
      <a class="home-link" href="https://publisher-microfrontend.vercel.app">
        <strong>Publishers</strong>
        <span>Publishing houses and titles</span>
      </a>
      <a class="home-link" href="https://AndreaCarrilloOp.github.io/library-microfrontends-microservices/microfrontends/reviews">
        <strong>Reviews</strong>
        <span>Reader ratings and comments</span>
      </a>
    </nav>
  </main>
</body>
</html>
