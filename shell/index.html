<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Distributed Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="brand-kicker">Distributed collection</p>
        <h1 class="brand-title">Library Catalog</h1>
      </div>

      <nav class="nav" aria-label="Library sections">
        <button class="is-active" type="button" onclick="loadSite('home.html', this)">Home</button>
        <button type="button" onclick="loadSite('https://book-microfrontend.netlify.app', this)">Books</button>
        <button type="button" onclick="loadSite('https://REPLACE_AUTHORS_MINISITE_URL', this)">Authors</button>
        <button type="button" onclick="loadSite('https://REPLACE_PUBLISHERS_MINISITE_URL', this)">Publishers</button>
        <button type="button" onclick="loadSite('https://REPLACE_REVIEWS_MINISITE_URL', this)">Reviews</button>
      </nav>
    </header>

    <section class="frame-wrap" aria-label="Selected library section">
      <iframe id="library-frame" title="Library content" src="home.html"></iframe>
    </section>

    <footer class="shell-footer">
      <span>Distributed Library Platform</span>
      <span>Academic project · Andrea Carrillo Oporto</span>
    </footer>
  </main>

  <script>
    function loadSite(url, button) {
      document.getElementById('library-frame').src = url
      document.querySelectorAll('.nav button').forEach(item => item.classList.remove('is-active'))
      if (button) button.classList.add('is-active')
    }
  </script>
</body>
</html>
